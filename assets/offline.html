<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STEENY — сервер недоступен</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow: hidden;
      color: #f3ede4; background:
        radial-gradient(circle at 15% 90%, rgba(193,101,45,.3), transparent 38rem),
        radial-gradient(circle at 85% 10%, rgba(139,110,224,.27), transparent 34rem),
        #0b0908;
      font-family: Inter, "Segoe UI", sans-serif;
    }
    .drag {
      position: fixed; inset: 0 0 auto; height: 58px;
      -webkit-app-region: drag;
    }
    .window-controls {
      position: fixed; top: 10px; right: 10px; z-index: 2;
      display: flex; gap: 4px; -webkit-app-region: no-drag;
    }
    .window-controls button {
      width: 42px; height: 38px; border: 0; border-radius: 10px;
      color: #c9bfb5; background: transparent; cursor: pointer; font-size: 18px;
    }
    .window-controls button:hover { background: rgba(255,255,255,.08); }
    .window-controls .close:hover { background: rgba(226,90,90,.28); }
    .card {
      width: min(430px, calc(100vw - 40px)); padding: 38px;
      text-align: center; border: 1px solid rgba(255,255,255,.08);
      border-radius: 26px; background: rgba(27,21,17,.9);
      box-shadow: 0 28px 90px rgba(0,0,0,.5); backdrop-filter: blur(22px);
    }
    .icon {
      width: 84px; height: 84px; display: grid; place-items: center;
      margin: 0 auto 22px; border-radius: 24px;
      color: #c8b6ff; background: rgba(167,139,250,.12);
    }
    h1 { margin: 0; font-size: 25px; }
    p { margin: 11px 0 25px; color: #9d9185; font-size: 14px; line-height: 1.5; }
    .retry {
      width: 100%; min-height: 46px; border: 0; border-radius: 999px;
      color: #160f28; background: #a78bfa; cursor: pointer;
      font-weight: 800; font-size: 14px;
    }
    .retry:disabled { opacity: .6; cursor: wait; }
    .status { min-height: 18px; margin-top: 12px; color: #817569; font-size: 12px; }
  </style>
</head>
<body>
  <div class="drag"></div>
  <div class="window-controls">
    <button id="minimize" aria-label="Свернуть">—</button>
    <button class="close" id="close" aria-label="Закрыть">×</button>
  </div>
  <main class="card">
    <div class="icon">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path>
        <circle cx="12" cy="19" r="1" fill="currentColor"></circle>
        <path d="M3 4l18 18"></path>
      </svg>
    </div>
    <h1>Сервер STEENY недоступен</h1>
    <p>Запустите backend или проверьте адрес в переменной <code>STEENY_URL</code>, затем повторите подключение.</p>
    <button class="retry" id="retry">Повторить</button>
    <div class="status" id="status"></div>
  </main>
  <script>
    document.getElementById('minimize').onclick = () => window.steenyElectron?.minimize_app();
    document.getElementById('close').onclick = () => window.steenyElectron?.close_app();
    document.getElementById('retry').onclick = async event => {
      const button = event.currentTarget;
      const status = document.getElementById('status');
      button.disabled = true;
      status.textContent = 'Подключение…';
      const connected = await window.steenyElectron?.retry_backend();
      if (!connected) {
        status.textContent = 'Backend пока не отвечает';
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
